<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #111d2b;
  }

  .ad {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Jost', sans-serif;
  }

  /* Background photo */
  .ad-bg {
    position: absolute;
    inset: 0;
  }
  .ad-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 75%;
  }

  /* Top gradient — strong dark covering logo + headline */
  .overlay-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 760px;
    background: linear-gradient(
      to bottom,
      rgba(17, 29, 43, 0.93) 0%,
      rgba(17, 29, 43, 0.88) 35%,
      rgba(17, 29, 43, 0.65) 60%,
      rgba(17, 29, 43, 0.2) 80%,
      transparent 100%
    );
  }

  /* Bottom gradient */
  .overlay-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 680px;
    background: linear-gradient(
      to top,
      #111d2b 0%,
      #111d2b 40%,
      rgba(17, 29, 43, 0.92) 60%,
      rgba(17, 29, 43, 0.45) 80%,
      transparent 100%
    );
  }

  /* ── TOP ZONE — Logo */
  .zone-top {
    position: absolute;
    top: 156px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }

  .logo {
    width: 230px;
    filter: brightness(0) invert(1);
    opacity: 0.95;
  }

  /* ── HEADLINE ZONE — white text on dark overlay */
  .zone-headline {
    position: absolute;
    top: 390px;
    left: 72px;
    right: 72px;
  }

  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 86px;
    line-height: 1.04;
    letter-spacing: -0.025em;
    color: #fbf3da;
  }

  .headline em {
    font-style: italic;
    font-weight: 300;
    color: #f0e0c0;
  }

  .gold-rule {
    display: block;
    width: 64px;
    height: 3px;
    background: #b87333;
    margin-top: 30px;
  }

  /* ── BOTTOM ZONE — CTA */
  .zone-bottom {
    position: absolute;
    bottom: 258px;
    left: 72px;
    right: 72px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .credential {
    font-family: 'Jost', sans-serif;
    font-size: 21px;
    font-weight: 400;
    letter-spacing: 0.22em;
    color: #b87333;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 24px;
  }

  .cta-btn {
    display: block;
    width: 100%;
    padding: 36px 0;
    background: #b87333;
    color: #fff;
    font-family: 'Jost', sans-serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    text-decoration: none;
    border-radius: 3px;
    box-shadow:
      0 4px 24px rgba(184, 115, 51, 0.35),
      0 1px 4px rgba(0, 0, 0, 0.3);
  }

  .compliance {
    font-family: 'Jost', sans-serif;
    font-size: 18px;
    font-weight: 300;
    color: rgba(251, 243, 218, 0.45);
    text-align: center;
    line-height: 1.55;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="ad-bg">
    <img src="./Static-Image-Ad1.png" alt="">
  </div>

  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  <div class="zone-top">
    <img class="logo" src="./engel-financial-group-trasnarent.png" alt="Engel Financial Group">
  </div>

  <div class="zone-headline">
    <h1 class="headline">Don't leave<br>your family<br>with a <em>question<br>mark.</em></h1>
    <span class="gold-rule"></span>
  </div>

  <div class="zone-bottom">
    <div class="credential">Licensed Insurance Advisor</div>
    <div class="cta-btn">See If You Qualify</div>
    <p class="compliance">Coverage options vary by type, age, and health.<br>A licensed advisor can help understand what may be available.</p>
  </div>
</div>
</body>
</html>
